<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- โลโก้: สามเฟรมซ้อนเหลื่อมกัน — อ่านได้สองแบบ
       แบบแรกคือเฟรมแอนิเมชันที่วางทับกันแบบ onion skin
       แบบที่สองคือเลเยอร์ ซึ่งใช้ได้กับทั้งงานภาพและงานโค้ด -->
  <rect width="64" height="64" rx="14" fill="#08090a"/>
  <g fill="none" stroke="#7c88ff" stroke-width="2.6" stroke-linejoin="round">
    <rect x="14" y="14" width="24" height="24" rx="5" opacity=".35"/>
    <rect x="20" y="20" width="24" height="24" rx="5" opacity=".65"/>
    <rect x="26" y="26" width="24" height="24" rx="5"/>
  </g>
</svg>
