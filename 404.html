<!-- ============================================================
     GitHub Pages ให้ 404.html ทำงานจากทุก path ที่ไม่มีไฟล์จริง
     แต่หน้าที่ถูกเสิร์ฟจะอยู่ที่ URL เดิม ทำให้ path สัมพัทธ์อย่าง
     assets/css/... พังทันทีถ้า URL ผิดพลาดอยู่ลึกกว่าหนึ่งชั้น
     สคริปต์นี้จึงแก้ <base> ให้ชี้กลับรากเว็บก่อน CSS จะโหลด
     ============================================================ -->
<script>
(function () {
  var seg = location.pathname.split('/').filter(Boolean);
  // บน GitHub Pages ชั้นแรกคือชื่อ repo จึงไม่นับเป็นความลึกของหน้า
  var depth = Math.max(0, seg.length - (location.hostname.endsWith('github.io') ? 2 : 1));
  if (depth > 0) {
    var b = document.createElement('base');
    b.href = '../'.repeat(depth);
    document.head.prepend(b);
  }
})();
</script>
</head>

<!-- ชั้นแสงเคลื่อนไหวเป็นฉากหลัง — CSS ล้วน ดู .ambient ใน motion.css -->
